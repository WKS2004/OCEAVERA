name: Maintain development backup

on:
  push:
    branches:
      - dev
      - dev-backup

permissions:
  contents: write

concurrency:
  group: development-backup-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Preserve backup history and synchronise dev-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve extra backup commits and synchronise
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          dev_sha=$(git rev-parse origin/dev)

          if ! git ls-remote --exit-code --heads origin dev-backup >/dev/null 2>&1; then
            git push origin "${dev_sha}:refs/heads/dev-backup"
            echo "dev-backup did not exist; created it from dev at ${dev_sha}."
            exit 0
          fi

          git fetch origin dev-backup
          backup_sha=$(git rev-parse origin/dev-backup)
          if [ "$dev_sha" = "$backup_sha" ]; then
            echo "dev-backup already matches dev at $dev_sha."
            exit 0
          fi

          mistaken_commits=$(git rev-list --reverse "origin/dev..origin/dev-backup")
          if [ -n "$mistaken_commits" ]; then
            timestamp=$(TZ=Asia/Colombo date '+%Y-%m-%d-%H-%M-%S-%3N')
            actor=$(printf '%s' "$ACTOR" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
            rescue_branch="dev-backup-mistaken-commits/${actor}/${timestamp}"

            git switch --create "$rescue_branch" "origin/dev"
            if git merge --no-ff --no-edit -X theirs "origin/dev-backup"; then
              echo "Preserved all unwanted commits and preferred their content where a merge conflict was possible."
            else
              git merge --abort || true
              echo "Merge conflict while preserving unwanted dev-backup commits; recording both histories with an explicit merge commit."
              git merge --no-ff --no-edit -s ours "origin/dev-backup"
            fi
            git push origin "HEAD:refs/heads/${rescue_branch}"
            echo "Preserved all unwanted commits in merge commit on ${rescue_branch}."
          fi

          if ! git push --force-with-lease="refs/heads/dev-backup:${backup_sha}" origin "${dev_sha}:refs/heads/dev-backup"; then
            echo "::error::Could not synchronise dev-backup. The branch may have changed during this run, or repository rules may block force updates. Allow this workflow's token to update dev-backup, permit the rescue branch, and review the relevant branch rules before rerunning."
            exit 1
          fi
          echo "dev-backup synchronised with dev at ${dev_sha}."
